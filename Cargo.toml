[package]
name = "modloader-profile-switcher"
version = "1.0.0"
edition = "2021" # Change edition to 2021 just to be safe with most crates

[[bin]]
name = "ProfileSwitcher"
path = "src/main.rs"

[dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.3"
regex = "1.10.3"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
